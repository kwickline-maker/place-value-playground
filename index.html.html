<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Place Value Playground</title>
<style>
:root{--ink:#20304c;--purple:#6651ce;--lav:#eeeaff;--blue:#e4f2ff;--green:#e2f8e9;--yellow:#fff1b8;--pink:#ffe5ed;--red:#b63854}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f3edff,#e7f7ff 55%,#fff4df);color:var(--ink);font:18px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #ffb82e;outline-offset:3px}.shell{max-width:1040px;margin:auto;padding:18px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(24px,4vw,38px);font-weight:900;color:#4934a6}.pill{background:white;border-radius:40px;padding:10px 16px;font-weight:800;box-shadow:0 4px 12px #32316b16}.hero{text-align:center;background:white;border-radius:26px;padding:18px;margin:15px 0;box-shadow:0 9px 24px #32316b14}.hero small{font-weight:800;color:#6651ce;letter-spacing:.05em}.number{font-size:clamp(64px,11vw,106px);font-weight:950;color:#4934a6;line-height:1.15}.hero p{margin:4px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tab{background:white;border:3px solid transparent;border-radius:18px;padding:13px 6px;font-weight:800;min-height:90px;box-shadow:0 4px 12px #32316b10}.tab.active{border-color:var(--purple);background:var(--lav)}.tab .emoji{font-size:28px;display:block}.tab.done{background:var(--green)}.panel{background:white;border-radius:26px;padding:clamp(16px,4vw,30px);margin-top:14px;box-shadow:0 9px 24px #32316b14;min-height:330px}.panel h2{font-size:clamp(24px,4vw,34px);margin:0 0 8px}.directions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.speak{border:0;border-radius:14px;background:#e6e0ff;padding:10px 14px;font-weight:800}.primary{background:var(--purple);color:white;border:0;border-radius:16px;padding:14px 25px;font-weight:900;min-height:52px}.secondary{background:#edf1fb;border:0;border-radius:14px;padding:12px 18px;font-weight:800}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}.feedback{min-height:42px;text-align:center;font-size:20px;font-weight:850;margin-top:12px}.feedback.good{color:#197c48}.feedback.bad{color:var(--red)}.block-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.block-choice{border:3px solid #d8d1ff;background:#faf9ff;border-radius:18px;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-weight:850}.block-choice:disabled{opacity:.55;cursor:default}.block-choices .count{font-size:23px}.flat{width:78px;height:78px;background-color:#8bd0ff;border:3px solid #267eb2;border-radius:4px;background-image:linear-gradient(to right,#267eb25a 1px,transparent 1px),linear-gradient(to bottom,#267eb25a 1px,transparent 1px);background-size:10% 10%}.rod{height:82px;width:18px;background:repeating-linear-gradient(to bottom,#ffc978 0 8px,#b97318 8px 9px);border:2px solid #b97318;border-radius:3px}.cube{width:26px;height:26px;background:#ff9db8;border:2px solid #b8406c;border-radius:4px}.workspace{background:#f5f8ff;border:2px dashed #b6c3df;border-radius:20px;padding:15px;margin-top:15px}.workspace h3{margin:0 0 8px}.workspace-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bucket{min-width:0;background:white;border-radius:14px;padding:10px;text-align:center;min-height:145px}.bucket h4{margin:0 0 8px}.pieces{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;max-height:260px;overflow:auto}.pieces .flat{width:36px;height:36px;flex:none}.pieces .rod{height:48px;width:12px;flex:none}.pieces .cube{width:18px;height:18px;flex:none}.piece-button{border:0;background:transparent;padding:3px;border-radius:5px}.piece-button:hover{background:#ffe6e6}.place-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.place{background:#f3f0ff;border-radius:18px;padding:14px 8px;text-align:center}.place strong{display:block;margin-bottom:10px}.digit-slot{width:100%;min-height:86px;background:white;border:3px dashed #aca1e4;border-radius:16px;font-size:54px;font-weight:900;color:#4934a6}.digit-slot.selected{border-style:solid;border-color:#6651ce}.digit-bank{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:18px}.digit{width:57px;height:60px;border-radius:13px;border:3px solid #8c77dc;background:#fff7ce;color:#24324f!important;font-size:29px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;opacity:1;visibility:visible;-webkit-text-fill-color:#24324f}.digit:disabled{opacity:.4}.options{display:grid;gap:12px}.option{width:100%;background:#f5f3ff;border:3px solid #dcd5ff;border-radius:16px;padding:17px;text-align:left;font-size:clamp(18px,2.7vw,25px);font-weight:800}.option.selected{border-color:#6651ce;background:#e8e1ff}.option:hover,.digit:hover,.block-choice:hover{filter:brightness(.97)}.foot{text-align:center;padding:15px;color:#52607b;font-size:14px}.complete{text-align:center;padding:15px}.complete .trophy{font-size:76px}.complete h2{font-size:38px}.status{font-weight:850;color:#5741b8}.confetti{animation:pop .5s ease}@keyframes pop{50%{transform:scale(1.05)}}@media(max-width:620px){.tabs{grid-template-columns:repeat(2,1fr)}.tab{min-height:76px}.block-choice{min-height:145px}.block-choices{gap:6px}.workspace-grid{gap:5px}.bucket{padding:7px}.shell{padding:10px}.place-grid{gap:6px}.digit{width:48px}}
</style></head><body><main class="shell"><header class="header"><div class="brand">🌈 Place Value Playground</div><div class="pill" id="score">⭐ 0 / 4 stars · 🏆 0 numbers</div></header><section class="hero" aria-live="polite"><small>YOUR MYSTERY NUMBER</small><div class="number" id="number">347</div><p>Show your number in four different ways!</p><button class="speak" id="readNumber">🔊 Hear my number</button></section><nav class="tabs" aria-label="Math activities" id="tabs"></nav><section class="panel" id="panel"></section><footer class="foot">Made for curious mathematicians! ✨ No accounts, no typing, just math.</footer></main>
<script>
(()=>{'use strict';
const names=['Model Form','Place Value Chart','Expanded Form','Word Form'];const emojis=['🧱','🔢','➕','🔤'];const $=id=>document.getElementById(id);let n,tab=0,done=[false,false,false,false],completed=0,blocks=[0,0,0],slots=[null,null,null],selectedSlot=0,chosen=null,choices=[],message='',messageGood=false;
const digits=()=>[Math.floor(n/100),Math.floor(n/10)%10,n%10];const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function word(num){if(num===0)return 'zero';const ones=['','one','two','three','four','five','six','seven','eight','nine'],teens=['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];let h=Math.floor(num/100),r=num%100,s=h?ones[h]+' hundred':'';if(r){let w=r<10?ones[r]:r<20?teens[r-10]:tens[Math.floor(r/10)]+(r%10?'-'+ones[r%10]:'');s+=(s?' ':'')+w}return s}
function expanded(num){let d=[Math.floor(num/100)*100,Math.floor(num/10)%10*10,num%10];return d.filter(v=>v!==0).join(' + ')}
let availableVoices=[];
function refreshVoices(){if(!('speechSynthesis' in window))return;availableVoices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en'));}
function bestVoice(){return availableVoices.find(v=>/Google US English|Microsoft (Aria|Jenny|Samantha|Natural)|Samantha|Ava|Karen/i.test(v.name))||availableVoices.find(v=>v.lang==='en-US'&&/natural|enhanced|premium/i.test(v.name))||availableVoices.find(v=>v.lang==='en-US')||availableVoices[0]}
function speak(t){if(!('speechSynthesis' in window)){setFeedback('This browser does not support read-aloud.',false);return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.96;u.pitch=1;u.volume=1;const v=bestVoice();if(v){u.voice=v;u.lang=v.lang}speechSynthesis.speak(u)}
if('speechSynthesis' in window){speechSynthesis.addEventListener?.('voiceschanged',refreshVoices);setTimeout(refreshVoices,0)}
function newRound(){n=rand(100,999);done=[false,false,false,false];blocks=[0,0,0];slots=[null,null,null];selectedSlot=0;chosen=null;tab=0;message='';buildChoices();render()}
function buildChoices(){let opts=new Set([n]);while(opts.size<4){let d=digits(),index=rand(0,2),other=d.slice();other[index]=rand(0,9);let value=other[0]*100+other[1]*10+other[2];if(value>=100&&value!==n)opts.add(value)}choices=[...opts].sort(()=>Math.random()-.5)}
function setFeedback(s,good){message=s;messageGood=good;let el=$('feedback');if(el){el.textContent=s;el.className='feedback '+(good?'good':'bad')}}
function showTab(i){tab=i;chosen=null;message='';render()}
function render(){const d=digits();$('number').textContent=n.toLocaleString('en-US');$('score').textContent=`⭐ ${done.filter(Boolean).length} / 4 stars · 🏆 ${completed} numbers`;$('tabs').innerHTML=names.map((name,i)=>`<button class="tab ${tab===i?'active':''} ${done[i]?'done':''}" data-tab="${i}" aria-current="${tab===i?'page':'false'}"><span class="emoji">${done[i]?'⭐':emojis[i]}</span>${name}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>showTab(+b.dataset.tab));
if(done.every(Boolean)){renderComplete();return}let html=`<h2>${emojis[tab]} ${names[tab]} ${done[tab]?'⭐':''}</h2><div class="directions"><span id="instruction"></span><button class="speak" id="readDirections">🔊 Read to me</button></div>`;let instruction='';
if(tab===0){instruction='Build the mystery number. Tap the hundreds, tens, and ones blocks to add them. Tap a block in your workspace to remove it.';html+=`<div class="block-choices">${['Hundred','Ten','One'].map((name,i)=>`<button class="block-choice" data-add="${i}" ${done[0]?'disabled':''}><span class="${['flat','rod','cube'][i]}"></span><span>+ Add ${name}</span><span class="count">${blocks[i]}</span></button>`).join('')}</div><div class="workspace"><h3>My base-ten model</h3><div class="workspace-grid">${['Hundreds','Tens','Ones'].map((name,i)=>`<div class="bucket"><h4>${name}</h4><div class="pieces">${Array.from({length:blocks[i]},(_,j)=>`<button class="piece-button" data-remove="${i}" aria-label="Remove one ${name.toLowerCase()} block"><span style="display:block" class="${['flat','rod','cube'][i]}"></span></button>`).join('')||'<span style="color:#8a91a4">Empty</span>'}</div></div>`).join('')}</div></div>`}
if(tab===1){instruction='Build the place value chart. Tap a column, then tap the digit that belongs there. You can change your answer.';html+=`<div class="place-grid">${['Hundreds','Tens','Ones'].map((name,i)=>`<div class="place"><strong>${name}</strong><button class="digit-slot ${selectedSlot===i?'selected':''}" data-slot="${i}" aria-label="${name}: ${slots[i]===null?'empty':slots[i]}">${slots[i]===null?'?':slots[i]}</button></div>`).join('')}</div><p style="text-align:center;font-weight:800">Choose a digit for the highlighted column:</p><div class="digit-bank" aria-label="Choose a digit from zero to nine">${Array.from({length:10},(_,i)=>`<button type="button" class="digit" data-digit="${i}" aria-label="Choose digit ${i}" ${done[1]?'disabled':''}><span style="color:#24324f;font-size:29px;font-weight:900">${i}</span></button>`).join('')}</div>`}
if(tab===2){instruction='Which expanded form matches your mystery number? Tap the correct answer.';html+=`<div class="options">${choices.map((x,i)=>`<button class="option ${chosen===i?'selected':''}" data-option="${i}" ${done[2]?'disabled':''}>${expanded(x)}</button>`).join('')}</div>`}
if(tab===3){instruction='Which word form matches your mystery number? Tap the correct answer. You can listen to each choice.';html+=`<div class="options">${choices.map((x,i)=>`<div style="display:flex;gap:7px;align-items:stretch"><button class="option ${chosen===i?'selected':''}" data-option="${i}" ${done[3]?'disabled':''}>${word(x)}</button><button class="speak" data-say="${i}" aria-label="Read choice ${i+1}">🔊</button></div>`).join('')}</div>`}
html+=`<div class="controls"><button class="primary" id="check" ${done[tab]?'disabled':''}>${done[tab]?'⭐ Completed!':'✓ Check My Answer'}</button>${tab===0?'<button class="secondary" id="clear">Clear Blocks</button>':''}</div><div class="feedback ${messageGood?'good':'bad'}" id="feedback" role="status">${message}</div>`;$('panel').innerHTML=html;$('instruction').textContent=instruction;$('readDirections').onclick=()=>speak(instruction);$('check').onclick=check;
$('panel').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let i=+b.dataset.add;if(blocks[i]<40){blocks[i]++;message='';render()}else setFeedback('That is a lot of blocks! Try removing some.',false)});$('panel').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{blocks[+b.dataset.remove]--;message='';render()});$('panel').querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{selectedSlot=+b.dataset.slot;render()});$('panel').querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>{slots[selectedSlot]=+b.dataset.digit;selectedSlot=slots.findIndex(x=>x===null);if(selectedSlot<0)selectedSlot=0;message='';render()});$('panel').querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{chosen=+b.dataset.option;message='';render()});$('panel').querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(word(choices[+b.dataset.say])));if($('clear'))$('clear').onclick=()=>{blocks=[0,0,0];message='';render()}}
function check(){if(done[tab])return;let d=digits(),correct=false,hint='';if(tab===0){correct=blocks.every((v,i)=>v===d[i]);hint='Count your hundreds flats, tens rods, and ones cubes. Remember: each flat is 100, each rod is 10, and each cube is 1.'}else if(tab===1){correct=slots.every((v,i)=>v===d[i]);hint=slots.some(v=>v===null)?'Fill in all three columns, including any zeros.':'Look at each digit. Which is in the hundreds place? Tens place? Ones place?'}else{correct=chosen!==null&&choices[chosen]===n;hint=chosen===null?'Choose an answer first.':'Not quite! Think about how many hundreds, tens, and ones are in your number.'}if(correct){done[tab]=true;message='Amazing work! You earned a star! ⭐';messageGood=true;speak('Amazing work! You earned a star!');if(done.every(Boolean)){completed++;renderComplete();return}render();setTimeout(()=>{if(done[tab]){let next=done.findIndex(x=>!x);if(next!==-1)showTab(next)}},1100)}else{setFeedback('Try again! 💪 '+hint,false);speak('Try again. '+hint)}}
function renderComplete(){$('score').textContent=`⭐ 4 / 4 stars · 🏆 ${completed} numbers`;$('panel').innerHTML=`<div class="complete confetti"><div class="trophy">🏆🎉⭐</div><h2>Number Master!</h2><p>You showed <strong>${n}</strong> in all four ways!</p><p class="status">You have mastered ${completed} ${completed===1?'number':'numbers'} this session!</p><button class="primary" id="again">🎲 Play Another Round!</button><button class="speak" id="cheer" style="margin:10px">🔊 Hear your celebration</button></div>`;$('again').onclick=newRound;$('cheer').onclick=()=>speak('Hooray! You are a place value superstar! You showed '+n+' in four different ways!')}
$('readNumber').onclick=()=>speak('Your mystery number is '+word(n));newRound();
})();
</script></body></html>
